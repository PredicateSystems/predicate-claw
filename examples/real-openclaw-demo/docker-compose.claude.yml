version: "3.8"

services:
  # Predicate Authority Sidecar - Authorization Engine (Rust-based)
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    ports:
      - "8787:8787"
    environment:
      LOCAL_IDP_SIGNING_KEY: "demo-secret-key-replace-in-production-minimum-32-chars"
    volumes:
      - ./policy.json:/app/policy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - demo-net

  # Claude Code Agent with SecureClaw Plugin
  # Uses real Anthropic Claude API + Predicate Authority sidecar for authorization
  claude-agent:
    build:
      context: ../..
      dockerfile: examples/real-openclaw-demo/Dockerfile.claude
    depends_on:
      sidecar:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Anthropic Claude API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Predicate Authority Sidecar
      PREDICATE_SIDECAR_URL: http://sidecar:8787
      SECURECLAW_VERBOSE: "true"
      SECURECLAW_PRINCIPAL: "agent:claude-code-demo"

      # Claude Code hooks configuration
      CLAUDE_CODE_HOOKS_FILE: /app/claude-code-hooks.js
    volumes:
      - ./workspace:/workspace:rw
      - ./policy.json:/app/policy.json:ro
    working_dir: /workspace
    networks:
      - demo-net
    tty: true
    stdin_open: true

networks:
  demo-net:
    driver: bridge
