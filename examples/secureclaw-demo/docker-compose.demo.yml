version: "3.8"

services:
  # Predicate Authority Sidecar - the authorization engine
  # Used when running: docker compose up (both services)
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    ports:
      - "8787:8787"
    environment:
      LOCAL_IDP_SIGNING_KEY: "demo-secret-key-replace-in-production-minimum-32-chars"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - secureclaw-net
    profiles:
      - full

  # SecureClaw Demo - scripted chat scenarios
  # Can run standalone with external sidecar:
  #   PREDICATE_SIDECAR_URL=http://host.docker.internal:8787 docker compose run --rm demo
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      # Default to Docker network sidecar; override for external sidecar
      PREDICATE_SIDECAR_URL: ${PREDICATE_SIDECAR_URL:-http://sidecar:8787}
      SECURECLAW_PRINCIPAL: "agent:secureclaw-demo"
      SECURECLAW_VERBOSE: "false"
      DEMO_VERBOSE: "false"
      DEMO_TYPING_SPEED: ${DEMO_TYPING_SPEED:-30}
    networks:
      - secureclaw-net
    # For connecting to host machine (sidecar running locally with dashboard)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true

networks:
  secureclaw-net:
    driver: bridge
