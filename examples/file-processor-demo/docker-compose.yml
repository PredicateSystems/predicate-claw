# ============================================================================
# File Processor Demo - Docker Compose
# ============================================================================
#
# Demonstrates zero-trust file processing with /v1/execute endpoint.
#
# Components:
#   1. predicate-sidecar: Rust sidecar that executes operations
#   2. file-processor-agent: TypeScript agent with zero FS privileges
#
# The agent container is configured WITHOUT filesystem mounts to its
# workspace - all file operations go through the sidecar.
#
# ============================================================================

version: "3.8"

services:
  # ==========================================================================
  # Predicate Authority Sidecar
  # Downloads binary from GitHub releases via Dockerfile.sidecar
  # ==========================================================================
  predicate-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: predicate-sidecar
    ports:
      - "8787:8787"
    volumes:
      # Workspace - sidecar has access, agent doesn't
      - ./workspace:/workspace
    environment:
      - RUST_LOG=info
      # Signing key for mandate issuance (required for /v1/execute)
      - LOCAL_IDP_SIGNING_KEY=demo-secret-key-replace-in-production-minimum-32-chars
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - predicate-net

  # ==========================================================================
  # File Processor Agent
  # ==========================================================================
  file-processor-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-processor-agent
    depends_on:
      predicate-sidecar:
        condition: service_healthy
    environment:
      - PREDICATE_SIDECAR_URL=http://predicate-sidecar:8787
      - SECURECLAW_PRINCIPAL=agent:file-processor
      # LLM Provider selection (auto-detects if not set)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      # Anthropic Claude
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # Local LLM (Ollama/LM Studio)
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-llama3.2}
      - NODE_ENV=production
    # NOTE: No volume mounts for /workspace - agent cannot access filesystem
    # All operations go through sidecar's /v1/execute endpoint
    networks:
      - predicate-net

networks:
  predicate-net:
    driver: bridge
